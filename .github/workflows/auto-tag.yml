# Decides the next version and creates the tag. Triggered by a push to main.
#
# It does not build anything. It writes the version files, commits them, and pushes
# a tag; release-pipeline.yml is what reacts to that tag by building and publishing the APK.
# Splitting it this way means the version history is decided from one place
# (scripts/next_version.py) and the publishing rules stay in release-pipeline.yml, where the
# check that nothing untested gets shipped already lives.
#
# It writes to main directly, with no pull request. That is a deliberate trade: the
# version bump is a mechanical edit of three files that no human needs to read, and
# a release that waits on a PR is a release that waits on whoever is awake. The
# commit it makes is signed off and carries the version in the subject, so it is
# traceable like any other.

name: Auto-tag

on:
  push:
    branches: [main]
  # The escape hatch, for a release the convention does not imply: a rollback, a
  # hotfix out of band, or the very first tag. `bump: none` means "decide from the
  # commits", which is also what a plain push to main does.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to force, or none to decide from the commits"
        required: true
        default: none
        type: choice
        options: [none, patch, minor, major]
      dry_run:
        description: "Report the decision without writing, committing or tagging"
        required: false
        default: false
        type: boolean

# One decision at a time. Two runs racing would both compute a bump from the same
# starting point, push two commits setting the same version, and then push two tags.
concurrency:
  group: auto-tag
  cancel-in-progress: false

permissions:
  contents: write
  # To re-run a cancelled CI run (gh run rerun).
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version comes from the last tag and from the commits since it, so a
          # shallow clone would see neither.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Outputs every other step reads, and the single place the run's inputs are
      # normalised. On a push, `inputs.bump` is the empty string rather than "none",
      # and an empty `--force` would be consumed by the script as a missing value.
      - name: Read the inputs
        id: opts
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # A push has no inputs at all; anything but "patch"/"minor"/"major" means
          # "decide from the commits", which is the default behaviour.
          BUMP="none"
          if [ "$INPUT_BUMP" = "patch" ] || [ "$INPUT_BUMP" = "minor" ] || [ "$INPUT_BUMP" = "major" ]; then
            BUMP="$INPUT_BUMP"
          fi
          FORCED=no
          if [ "$INPUT_BUMP" != "$BUMP" ]; then
            echo "::warning::bump input '$INPUT_BUMP' is not one of patch/minor/major; deciding from the commits."
          elif [ "$BUMP" != "none" ]; then
            FORCED=yes
          fi

          # Same for dry_run: on a push the input is empty, which GitHub coerces to
          # the boolean false. Treating an empty string as true would make every
          # automatic run a dry run and nothing would ever be tagged.
          DRY=no
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY=yes
          fi

          {
            echo "bump=$BUMP"
            echo "forced=$FORCED"
            echo "dry_run=$DRY"
            echo "push=$([ "$EVENT" = "push" ] && echo yes || echo no)"
          } >> "$GITHUB_OUTPUT"

      - name: Decide the next version
        id: next
        env:
          FORCE: ${{ steps.opts.outputs.bump }}
          REPO_ROOT_ENV: ${{ github.workspace }}
        run: |
          set -euo pipefail

          LAST_TAG=$(git for-each-ref --sort=-creatordate \
            --format='%(refname:short)' 'refs/tags/v*.*.*' | head -1)
          echo "::group::commits since ${LAST_TAG:-the first commit}"
          if [ -n "$LAST_TAG" ]; then
            git log --oneline --no-merges "$LAST_TAG..HEAD"
          else
            git log --oneline --no-merges HEAD
          fi
          echo "::endgroup::"

          ARGS=()
          if [ "$FORCE" != "none" ]; then
            ARGS+=(--force "$FORCE")
          fi

          # The script exits 0 even when it decides there is nothing to release, so a
          # merge of documentation does not show up as a failed run.
          python3 scripts/next_version.py "${ARGS[@]}" | tee decision.env

          # Sourcing a file another script wrote is the one way this can go wrong
          # quietly, so every key is checked rather than trusted: a missing one
          # becomes an empty tag name three steps later, with nothing saying why.
          for key in LEVEL CURRENT BASE VERSION TAG COMMITS DRIFT REASON PENDING_TAG; do
            if ! grep -q "^$key=" decision.env; then
              echo "::error::decision.env has no $key line:"
              cat decision.env
              exit 1
            fi
          done

          # Each key is read ONCE into a shell variable and used for both the step
          # output and the log line below. The first version of this step grepped
          # the file twice and then referenced `$REASON` directly as a shell
          # variable, which had never been assigned: under `set -u` that is an
          # unbound-variable error, so the step died on a cosmetic `::notice::`
          # *after* writing correct outputs.
          LEVEL=$(grep '^LEVEL=' decision.env | cut -d= -f2-)
          CURRENT=$(grep '^CURRENT=' decision.env | cut -d= -f2-)
          BASE=$(grep '^BASE=' decision.env | cut -d= -f2-)
          VERSION=$(grep '^VERSION=' decision.env | cut -d= -f2-)
          TAG=$(grep '^TAG=' decision.env | cut -d= -f2-)
          COMMITS=$(grep '^COMMITS=' decision.env | cut -d= -f2-)
          DRIFT=$(grep '^DRIFT=' decision.env | cut -d= -f2-)
          REASON=$(grep '^REASON=' decision.env | cut -d= -f2-)
          PENDING_TAG=$(grep '^PENDING_TAG=' decision.env | cut -d= -f2-)

          # The two values that decide what gets published are checked here rather
          # than trusted, because everything downstream is a tag built out of them:
          # an unexpected level would fall through to no bump, and a malformed
          # version would become a tag nothing can release.
          case "$LEVEL" in
            none|patch|minor|major) ;;
            *) echo "::error::unexpected LEVEL '$LEVEL' from next_version.py"; exit 1 ;;
          esac
          if [ "$LEVEL" != "none" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::LEVEL is '$LEVEL' but VERSION is '$VERSION', not X.Y.Z"
            exit 1
          fi

          {
            echo "level=$LEVEL"
            echo "current=$CURRENT"
            echo "base=$BASE"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "commits=$COMMITS"
            echo "drift=$DRIFT"
            echo "reason=$REASON"
            echo "pending_tag=$PENDING_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::$REASON"

      - name: Say so when there is nothing to release
        if: steps.next.outputs.level == 'none'
        run: |
          echo "::notice::No releasable commit since ${{ steps.next.outputs.tag || 'the first tag' }}."
          echo "::notice::docs:, chore:, ci:, test: and unrecognised subjects do not ship an APK on their own."
          echo "::notice::To publish anyway, run this workflow with bump set to patch, minor or major."

      # A dry run stops here: every step below is gated on dry_run == 'no', so
      # nothing is written, committed or tagged and the decision is still on the
      # run's summary.
      # A pending bump means main already carries a version that was never tagged —
      # a previous run got this far and then failed. Re-bumping would burn another
      # number for the same single release (1.0.2, 1.0.3, ...) and the skipped ones
      # would sit in the history forever. The recovery is to tag what is already
      # there, which is why the bump steps below are skipped.
      - name: Explain a pending bump
        if: steps.next.outputs.pending_tag == 'yes'
        run: |
          echo "::notice::main is at ${{ steps.next.outputs.current }} but only ${{ steps.next.outputs.tag }} is tagged."
          echo "::notice::That version was written by a run that then failed. Tagging it as-is"
          echo "::notice::instead of bumping again — no new commit, no new number."

      - name: Write the version files
        if: steps.next.outputs.level != 'none' && steps.opts.outputs.dry_run == 'no' && steps.next.outputs.pending_tag != 'yes'
        run: |
          set -euo pipefail
          # All three files in one call: pyproject.toml, the fallback literal in
          # jafta/__init__.py (the APK ships no pyproject, so that literal is what
          # the app actually shows) and versionName/versionCode in the Gradle build.
          python3 scripts/release.py "${{ steps.next.outputs.version }}"
          git --no-pager diff --stat

      - name: Commit the version bump
        if: steps.next.outputs.level != 'none' && steps.opts.outputs.dry_run == 'no' && steps.next.outputs.pending_tag != 'yes'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          LEVEL: ${{ steps.next.outputs.level }}
        run: |
          set -euo pipefail
          # Signed off, because CONTRIBUTING.md asks for it and because a commit that
          # lands on main unattended is exactly the kind nobody re-reads later.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml jafta/__init__.py android/app/build.gradle.kts
          git commit -s -m "chore(release): $VERSION" \
            -m "$LEVEL bump decided by scripts/next_version.py, written by scripts/release.py."
          git --no-pager log -1 --format='%H %s'

      - name: Push the bump
        if: steps.next.outputs.level != 'none' && steps.opts.outputs.dry_run == 'no' && steps.next.outputs.pending_tag != 'yes'
        run: |
          set -euo pipefail
          # A plain push, never --force: this workflow must not rewrite history a
          # human may be reading.
          git push origin HEAD:main

      # release-pipeline.yml refuses to publish from a tag whose commit has not passed CI,
      # and it checks that on the tag's own commit. Tagging straight after the bump
      # would race CI: the tag could land while the checks were still queued, and
      # the release would refuse for a reason that has nothing to do with the code.
      #
      # The wait is on the PARENT, not on the bump commit, and that is not a
      # shortcut. A push made with GITHUB_TOKEN does not trigger workflow runs —
      # GitHub suppresses them to stop workflows recursing — so the bump commit
      # this workflow just created will never have CI, Android Build, Pages or
      # anything else run against it. Waiting for it waits forever. Measured: a
      # merge to main gets 5 runs, the bot's own bump commit gets 0.
      #
      # The code that ships is the parent's tree plus three version strings, so CI
      # on the parent is CI on the code. What the bump itself could have changed is
      # checked immediately after, by name, rather than assumed.
      - name: Wait for CI on the code being released
        if: (steps.next.outputs.level != 'none' || steps.next.outputs.pending_tag == 'yes') && steps.opts.outputs.dry_run == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LEVEL: ${{ steps.next.outputs.level }}
          PENDING_TAG: ${{ steps.next.outputs.pending_tag }}
        run: |
          set -euo pipefail
          # The commit the tag will point at. If this run wrote the bump commit,
          # that commit is HEAD — and it never gets its own CI runs, because GitHub
          # suppresses workflows started by a GITHUB_TOKEN push — so the verdict we
          # need is the parent's. Otherwise (a pending bump recovered from an
          # earlier failed run, so no bump is written now) HEAD is a real human
          # merge with its own CI run, and waiting on the parent would gate on code
          # the tag does not contain. Seen on 37446916045: the recovery waited on
          # HEAD^'s run and failed on that run's cancelled tests, while the commit
          # actually being released had green CI.
          if [ "${PENDING_TAG:-no}" = "yes" ] || [ "${LEVEL:-none}" = "none" ]; then
            SHA=$(git rev-parse HEAD)
          else
            SHA=$(git rev-parse HEAD^)
          fi
          echo "waiting for the CI workflow on $SHA"

          # 20 minutes: CI here builds an APK on two Python versions, and it has
          # been observed taking a shade over 8.
          DEADLINE=$((SECONDS + 1200))
          RERUN_TRIED=no
          while :; do
            # The signal is the **CI workflow run** for this commit, not a count of
            # its check-runs. The first version of this step counted check-runs and
            # treated "none pending, none failed" as green — but a commit pushed a
            # second ago has *no* check-runs at all yet, and an empty list scored
            # exactly the same as a fully green one. The tag was therefore created
            # ten seconds after the push, with nothing having run. Waiting on the
            # workflow run closes that window: it cannot report "completed" before
            # it has started, and its absence is explicitly not success.
            RUNS=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | length')
            if [ "${RUNS:-0}" -eq 0 ]; then
              echo "  no CI run registered for this commit yet"
            else
              # Never stream a half-built string: map(...) returns [] when no
              # run has completed, `first` of that is a *string* "null null", and
              # the `// "in-progress"` fallback never reaches it because string
              # interpolation already stringified the nulls. CI in progress then
              # reads as concluded 'null' and stops the tag. Building the string
              # only inside `if` length > 0 makes the fallback real.
              STATUS=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == "CI" and .status == "completed")] | if length > 0 then "\(.[0].conclusion) \(.[0].html_url)" else "in-progress" end')
              if [ "$STATUS" != "in-progress" ]; then
                CONCLUSION=${STATUS%% *}
                URL=${STATUS#* }
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI is green on $SHA"
                  exit 0
                fi
                # A run concludes 'cancelled' when a newer push to main cancels it
                # (cancel-in-progress) or when the Actions service drops it —
                # both happened in one day, the service once. That is no verdict on
                # the code, but without a nudge the CI never re-runs and this step
                # would have to fail on a transient. Re-run the failed jobs once;
                # a second cancellation is no longer transient.
                if [ "$CONCLUSION" = "cancelled" ] && [ "$RERUN_TRIED" = "no" ]; then
                  RERUN_TRIED=yes
                  RUN_ID=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                    --jq '[.workflow_runs[] | select(.name == "CI")] | first | .id')
                  echo "::notice::CI on $SHA was cancelled; re-running its failed jobs"
                  gh run rerun "$RUN_ID" --repo "$REPO" --failed || true
                  # Give the rerun a few seconds to register before polling again,
                  # or the next poll sees the same stale 'cancelled' and exits.
                  sleep 30
                  continue
                fi
                echo "::error::CI concluded '$CONCLUSION' on $SHA; not tagging."
                echo "::error::The version files are bumped but no tag was created. Re-run this"
                echo "::error::workflow once the failure is fixed, or revert the bump commit."
                echo "::error::$URL"
                gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
                  --jq '.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped")
                        | "  \(.name): \(.conclusion)"' || true
                exit 1
              fi
              echo "  CI is still running..."
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::CI still running on $SHA after 20 minutes; not tagging."
              exit 1
            fi
            sleep 20
          done

      # What the bump was allowed to change. Small enough to be a list, and the
      # alternative is trusting that a script only ever writes the version — which
      # is exactly the assumption that produced a tag ten seconds after a push.
      #
      # The bump commit is FOUND, not assumed to be HEAD^. It usually is, but in
      # the recovery path it is not: the orphan bump sits some way back in history
      # and merges have landed on top of it since. Comparing HEAD^ against the
      # parent then measures the wrong diff entirely — it compared the *merge* of
      # the workflow change against the orphan and called the YAML "shipped code".
      #
      # Located by its own subject, which is the one thing every bump commit has and
      # no human or merge commit does.
      - name: Check the bump touched only the version files
        if: (steps.next.outputs.level != 'none' || steps.next.outputs.pending_tag == 'yes') && steps.opts.outputs.dry_run == 'no'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify HEAD^ >/dev/null; then
            BUMP=$(git log --format='%H%x09%s' | awk -F'\t' -v v="$VERSION" \
              '$2 == "chore(release): " v { print $1; exit }' || true)
          else
            BUMP=""
          fi

          if [ -z "$BUMP" ]; then
            echo "first release: no bump commit to check"
            exit 0
          fi
          if ! git rev-parse -q --verify "$BUMP^" >/dev/null; then
            echo "the bump commit is the root commit; nothing to compare against"
            exit 0
          fi

          echo "bump commit: $(git log -1 --format='%h %s' "$BUMP")"
          CHANGED=$(git diff --name-only "$BUMP^" "$BUMP" | sort)
          echo "bump changed:"
          echo "$CHANGED" | sed 's/^/  /'
          UNEXPECTED=$(echo "$CHANGED" | grep -vE \
            '^(pyproject[.]toml|jafta/__init__[.]py|android/app/build[.]gradle[.]kts)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::the version bump changed files that are not version files:"
            echo "$UNEXPECTED" | sed 's/^/  /'
            echo "::error::Those are shipped code. Not tagging."
            exit 1
          fi
          echo "bump is version-only"

      - name: Create and push the tag
        if: (steps.next.outputs.level != 'none' || steps.next.outputs.pending_tag == 'yes') && steps.opts.outputs.dry_run == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.next.outputs.version }}
          LEVEL: ${{ steps.next.outputs.level }}
          REASON: ${{ steps.next.outputs.reason }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          # An annotated tag is a commit object, and a commit object needs a
          # committer identity — but the only place this workflow set one was the
          # "Commit the version bump" step above, whose `if` excludes exactly the
          # path taken here. On the recovery path (a pending bump from an earlier
          # run, no new commit to write) the identity was still unset and
          # `git tag -a` died with "empty ident name not allowed". Observed on the
          # first real recovery run, after the version-only check had passed.
          #
          # Set here rather than in a shared early step so it is configured by the
          # same step that needs it, and cannot be skipped away again.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # The tag is already there and this run is publishing exactly it. That
            # is the re-run case, not a conflict: the version is already tagged, so
            # the release may simply not have been cut yet (it was dispatched
            # before it existed, or the run died mid-way). Carry on and dispatch.
            # release-pipeline.yml deletes and recreates the release, so re-running is safe.
            echo "::notice::$TAG already exists; dispatching Release for it again."
          else
            # Annotated, not lightweight: next_version.py reads tags by creatordate,
            # and a lightweight tag carries the commit date instead, which makes two
            # tags created out of order sort wrong and silently re-release an old
            # version.
            git tag -a "$TAG" -m "$TAG" -m "$REASON" \
              -m "versionCode is bumped alongside; see android/app/build.gradle.kts."
            git push origin "refs/tags/$TAG"
            echo "::notice::pushed $TAG ($LEVEL)"
          fi

          echo "::notice::pushed $TAG ($LEVEL)"

          # Start the release ourselves, because the tag push will not.
          #
          # release-pipeline.yml listens on `push: tags`, and this push carries
          # GITHUB_TOKEN, which GitHub does not let create new workflow runs — the
          # same suppression that left the bump commit with no CI. So the tag lands
          # and nothing happens, and the release only ever appears if a human runs
          # Release by hand. That is the manual step this is here to remove.
          #
          # `workflow_dispatch` is one of the two documented exceptions and always
          # creates a run even from GITHUB_TOKEN, so it is the way through. The tag
          # argument is passed explicitly: the dispatch cannot rely on
          # github.ref_name, which is `main` here, not the tag.
          echo "dispatching Release for $TAG"
          gh workflow run release-pipeline.yml \
            --repo "$REPO" \
            --ref main \
            -f "tag=$TAG"

          echo "::notice::Release dispatched for $TAG. It builds the APK and publishes it;"
          echo "::notice::update-health.yml then validates the served manifest and APK."

      - name: Summary
        if: always()
        env:
          LEVEL: ${{ steps.next.outputs.level }}
          CURRENT: ${{ steps.next.outputs.current }}
          BASE: ${{ steps.next.outputs.base }}
          VERSION: ${{ steps.next.outputs.version }}
          DRIFT: ${{ steps.next.outputs.drift }}
          DRY: ${{ steps.opts.outputs.dry_run }}
          PENDING: ${{ steps.next.outputs.pending_tag }}
          REASON: ${{ steps.next.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "## Auto-tag"
            echo ""
            echo "- **Decision**: $REASON"
            echo "- **Level**: \`$LEVEL\`"
            echo "- **Version in the files**: \`$CURRENT\`"
            if [ "$DRIFT" = "yes" ]; then
              echo "- **Bumped from**: \`$BASE\` — the tag was ahead of the files, so the higher one won"
            fi
            echo ""
            if [ "$PENDING" = "yes" ]; then
              echo "Tagged **\`v$VERSION\`**, a bump that an earlier run wrote and never tagged."
            elif [ -z "$LEVEL" ] || [ "$LEVEL" = "none" ]; then
              echo "Nothing to release. Run this workflow with an explicit bump to publish anyway."
            elif [ "$DRY" = "yes" ]; then
              echo "Dry run: **\`v$VERSION\` would have been tagged**, but nothing was written."
            else
              echo "Tagged **\`v$VERSION\`**. release-pipeline.yml builds and publishes it;"
              echo "update-health.yml then checks the published manifest and APK."
            fi
          } >> "$GITHUB_STEP_SUMMARY"