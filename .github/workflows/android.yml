# Builds the APK. Every pull request gets a debug build; only main gets a
# signed release build, because only main is a thing users can be sent.
#
# This does NOT publish anything. A release is cut by release.yml on a tag, and
# the artifact this produces is what that workflow verifies and uploads. Keeping
# the two apart means a broken main never publishes an APK, and a release never
# builds untested code.
#
# The workflow this replaces lived only on the unmerged rebrand branch and could
# not have worked on main. Four reasons, all of them fixed below:
#
#   1. It exported JAFTA_KEYSTORE_FILE. build.gradle.kts reads JAFTA_KEYSTORE_PATH
#      (see signingCredential() there). With the wrong name, hasReleaseSigning is
#      false and assembleRelease silently produces an UNSIGNED apk — which then
#      gets uploaded as "jafta-release-apk" and looks like a successful release.
#   2. It hardcoded keyAlias: jafta in the workflow. The alias lives in
#      JAFTA_KEY_ALIAS and must come from the same place as the password.
#   3. It passed the keystore path as a relative path ("keystore/...") while
#      gradle runs with android/ as its working directory, so file() resolved it
#      against android/keystore/... — a path that does not exist. Absolute here.
#   4. setup-android@v3 defaults to packages: 'tools platform-tools', and Google
#      removed the legacy tools package, so sdkmanager fails the whole job with
#      "Failed to find package 'tools'". v4 drops it from the default and also
#      filters 'tools' out in src/main.ts, warning rather than failing.
#
# A fifth bug was found by CI after the first four were fixed, and is the
# reason the packages line below is quoted on a single line. See that comment.
name: Android Build

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "jafta/**"
      - "scripts/release.py"
      - ".github/workflows/android.yml"
      # These two change what is *inside* the APK, so omitting them meant a
      # dependency bump produced no APK build and no test at all.
      # requirements-android.lock.txt is the file Chaquopy pip-installs, so it is
      # the dependency set of the shipped app, not a hint about it.
      - "requirements-android.lock.txt"
      - "requirements-android.txt"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "jafta/**"
      - "scripts/release.py"
      - ".github/workflows/android.yml"
      - "requirements-android.lock.txt"
      - "requirements-android.txt"
      - "pyproject.toml"
  # Building takes ~20 minutes. Being able to retry one without pushing a commit
  # is the difference between fixing a flaky runner and waiting for review.
  workflow_dispatch:

# Top level, not nested under `on:` — GitHub silently ignores it there.
concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# contents: read is the default and is all this needs. No write scopes: this
# workflow builds and verifies, it does not publish.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Gradle resolves the version from git metadata; without history it
          # either fails or stamps "unknown" into the APK.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Required, and the version is not negotiable: this app embeds CPython
      # via Chaquopy, and Chaquopy requires the build machine's Python to match
      # the app's major.minor exactly. app/build.gradle.kts pins
      # `chaquopy { defaultConfig { version = "3.11" } }`, and Chaquopy searches
      # for `python3.11` then `python3`. The runner image ships 3.12 as
      # `python3`, so without this step the build fails in
      # :app:installDebugPythonRequirements with:
      #
      #     Couldn't find Python 3.11.
      #     See https://chaquo.com/chaquopy/doc/current/android.html#buildpython
      #
      # pip install for the four target ABIs runs as part of that same task, so
      # this is needed for the debug build too, not only the release build.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Chaquopy fails with "Couldn't find Python 3.11", which names a version
      # but not the cause, and says nothing about which file to edit. So the
      # required version is read from the build file and checked here, where the
      # error can say what to do about it. This is what catches someone bumping
      # `chaquopy { version = ... }` to 3.12 and not updating the step above.
      - name: Verify Chaquopy's Python is the one on PATH
        run: |
          set -euo pipefail
          WANT=$(grep -oE 'version = "[0-9]+\.[0-9]+"' android/app/build.gradle.kts \
                 | head -1 | grep -oE '[0-9]+\.[0-9]+')
          if [ -z "$WANT" ]; then
            echo "::error::Could not read the Chaquopy Python version from android/app/build.gradle.kts"
            exit 1
          fi
          echo "Chaquopy requires Python $WANT"
          if ! command -v "python${WANT}" > /dev/null; then
            echo "::error::Chaquopy needs python${WANT} on PATH, and it is not there."
            echo "::error::Fix the 'Set up Python' step above to $WANT, to match"
            echo "::error::chaquopy { defaultConfig { version = \"$WANT\" } }."
            echo "::error::python3 is currently: $(command -v python3 || echo none) $(python3 -V 2>&1 || true)"
            exit 1
          fi
          echo "  found: $(command -v "python${WANT}") $("python${WANT}" -V 2>&1)"

      # Gradle 8.9 (android/gradle/wrapper/gradle-wrapper.properties) wants a
      # compileSdk of 34 and build-tools 34.0.0; the action only installs the
      # platform-tools by default, so the rest is asked for by name.
      # packages is split on a single space (`packages.split(' ')` in
      # src/main.ts) — never on newlines. A YAML block scalar arrives as one
      # string containing newlines, so `packages: |` hands sdkmanager a single
      # package literally named "platform-tools\nplatforms;android-34\n..." and
      # the step dies with "Failed to find package". Keep this on one line.
      #
      # platform-tools is the action's own default, but setting `packages`
      # overrides the default, so it has to be named here to stay installed.
      # build-tools;34.0.0 is AGP 8.7.0's default for compileSdk 34.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # apksigner lives in build-tools/<version>/, and setup-android puts only
      # cmdline-tools and platform-tools on PATH. So after asking for
      # build-tools;34.0.0 above, the tool is installed but not reachable by
      # name, and `apksigner verify` fails with "command not found" (exit 127).
      # Resolve it by the directory rather than hardcoding a path: the version
      # installed may not be 34.0.0 even though that is what was requested, and
      # a glob that matches nothing has to fail loudly here instead of turning
      # into a bare `apksigner` later.
      - name: Put apksigner on PATH
        run: |
          set -euo pipefail
          # Prefer the version this project builds with. The runner image
          # preinstalls other build-tools (37.0.0 among them), so taking the
          # last match alphabetically picks one of those instead of the
          # 34.0.0 requested above, and version sorting makes that worse, not
          # better: "37" > "34". Fall back to whatever exists only if the
          # pinned one is genuinely absent, since apksigner only has to be able
          # to read a v2/v3 signature, not match the compiler.
          PINNED="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          if [ -x "$PINNED" ]; then
            APKSIGNER="$PINNED"
          else
            echo "note: build-tools 34.0.0/apksigner not found; falling back to any installed build-tools"
            ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | head -1 > /tmp/apk || true
            APKSIGNER=$(cat /tmp/apk)
          fi
          # -x, not -f: a build-tools tree that exists but whose apksigner is
          # not executable would otherwise be accepted here and fail later at
          # the call site as exit 127, which is the exact bug this step exists
          # to prevent.
          if [ -z "${APKSIGNER:-}" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::No executable apksigner under $ANDROID_SDK_ROOT/build-tools/."
            echo "::error::The SDK step requests build-tools;34.0.0. Installed:"
            ls -l "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null || echo "  (no apksigner found)"
            exit 1
          fi
          # Deliberately no chmod. The runner image's SDK is root-owned while
          # the runner user is not root, so chmod fails with "Operation not
          # permitted" and takes the step down with it. apksigner already ships
          # executable, which is why this is not needed.
          echo "$(dirname "$APKSIGNER")" >> "$GITHUB_PATH"
          echo "apksigner: $APKSIGNER"
          # Called by full path, not by name: $GITHUB_PATH only takes effect in
          # LATER steps, so a bare `apksigner version` here is still "command
          # not found" — the same failure this step is fixing.
          "$APKSIGNER" version

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # The keystore is decoded into the runner's filesystem, never into the
      # workspace, so nothing downstream can accidentally commit or cache it.
      # $RUNNER_TEMP is also outside the checkout, which means git add -A in any
      # later step cannot reach it.
      - name: Decode release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.JAFTA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JAFTA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JAFTA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::JAFTA_KEYSTORE_BASE64 is not set — cannot sign a release APK."
            echo "::error::Run: python3 scripts/encode_keystore_for_secret.py --set-secrets"
            exit 1
          fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::JAFTA_KEYSTORE_PASSWORD is not set."
            exit 1
          fi
          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::JAFTA_KEY_ALIAS is not set."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jafta-release.keystore"
          # echo -n: a trailing newline here becomes part of the password and
          # keytool rejects it with a message that looks like a wrong password.
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/jafta-storepass"
          echo "keystore decoded to $RUNNER_TEMP/jafta-release.keystore"
          echo "alias: $KEY_ALIAS"

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # The four names build.gradle.kts actually reads. The old workflow got
          # three of these wrong, which is why it could only ever have produced
          # an unsigned APK on main.
          JAFTA_KEYSTORE_PATH: ${{ runner.temp }}/jafta-release.keystore
          JAFTA_KEYSTORE_PASSWORD: ${{ secrets.JAFTA_KEYSTORE_PASSWORD }}
          JAFTA_KEY_ALIAS: ${{ secrets.JAFTA_KEY_ALIAS }}
          JAFTA_KEY_PASSWORD: ${{ secrets.JAFTA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      # An unsigned APK is the failure mode that matters most here: it installs
      # fine on a clean device, looks like a working release, and cannot ever be
      # upgraded in place. So the signature is checked, not assumed — and the
      # expected digest is read from the key we just decoded rather than
      # hardcoded, so a legitimate key rotation updates this file instead of
      # failing CI forever.
      - name: Verify the release APK is signed with our key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.JAFTA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::assembleRelease produced no APK at $APK"
            exit 1
          fi
          echo "--- apksigner verify ---"
          apksigner verify --verbose --print-certs "$APK" | tee android-signature.txt

          # An APK with no signer at all: apksigner reports success on some
          # builds when verification is skipped, so check the output for the
          # actual signer rather than trusting the exit code alone.
          if ! grep -q "Signer #1 certificate SHA-256 digest:" android-signature.txt; then
            echo "::error::APK carries no v2/v3 signer — this is an UNSIGNED build."
            echo "::error::Check that JAFTA_KEYSTORE_PATH points at a real file and that"
            echo "::error::JAFTA_KEYSTORE_PASSWORD / JAFTA_KEY_ALIAS / JAFTA_KEY_PASSWORD are set."
            exit 1
          fi

          ACTUAL=$(grep -m1 "Signer #1 certificate SHA-256 digest:" android-signature.txt \
                   | sed 's/.*digest: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          # Digest of the keystore's own certificate. keytool cannot read a
          # keystore from a pipe — it seeks, so /dev/stdin comes back empty and
          # keytool reports "Keystore file exists, but is empty" — so this
          # re-reads the file decoded in the previous step. Both digests are
          # normalised to bare uppercase hex, because apksigner prints colons and
          # keytool does not, and comparing them raw would always mismatch.
          EXPECTED=$(keytool -list -v \
                       -keystore "$RUNNER_TEMP/jafta-release.keystore" \
                       -storepass "$(cat "$RUNNER_TEMP/jafta-storepass")" \
                       -alias "${{ secrets.JAFTA_KEY_ALIAS }}" 2>/dev/null \
                     | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ]; then
            echo "::error::Could not read a digest to compare (expected='$EXPECTED' actual='$ACTUAL')."
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK was signed with a DIFFERENT key than JAFTA_KEYSTORE_BASE64."
            echo "::error::Publishing this would strand every installed app: Android refuses"
            echo "::error::in-place updates across a signing-key change."
            exit 1
          fi
          echo "::notice::APK signed by the expected key."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jafta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jafta-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          # error, not warn: this artifact is what release.yml signs off on, and a
          # missing one should fail the build rather than pass quietly.
          if-no-files-found: error

      - name: Upload signature report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jafta-release-signature
          path: android-signature.txt
          retention-days: 90
          if-no-files-found: error
