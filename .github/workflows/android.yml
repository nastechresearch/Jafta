name: Android Build

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # cmdline-tools default (v22.0) ships without the legacy `tools`
          # package. The preinstalled 12.0 on the runner still has it.
          # Long build number 12266719 = short version 12.0.
          cmdline-tools-version: 12266719
          packages: >-
            tools
            platform-tools
            build-tools;35.0.0
            platforms;android-35

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.JAFTA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JAFTA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/jafta-release.keystore
            echo -n "$KEYSTORE_PASSWORD" > keystore/.storepass
            chmod 600 keystore/.storepass
            echo "::notice::Release keystore restored from secret"
          else
            echo "::warning::No JAFTA_KEYSTORE_BASE64 secret; using debug build only"
          fi

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Build release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          JAFTA_KEYSTORE_FILE: keystore/jafta-release.keystore
          JAFTA_KEYSTORE_PASSWORD: ${{ secrets.JAFTA_KEYSTORE_PASSWORD }}
          JAFTA_KEY_ALIAS: jafta
          JAFTA_KEY_PASSWORD: ${{ secrets.JAFTA_KEYSTORE_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -50

      - name: Verify APK signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk 2>&1 | tee android/app/build/outputs/apk/release/SIGNATURE.txt
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jafta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload signed release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jafta-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
