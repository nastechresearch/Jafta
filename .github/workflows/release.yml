name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JAFTA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JAFTA_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/jafta-release.keystore
          echo -n "$KEYSTORE_PASSWORD" > keystore/.storepass
          chmod 600 keystore/.storepass

      - name: Build signed release APK
        env:
          JAFTA_KEYSTORE_FILE: keystore/jafta-release.keystore
          JAFTA_KEYSTORE_PASSWORD: ${{ secrets.JAFTA_KEYSTORE_PASSWORD }}
          JAFTA_KEY_ALIAS: jafta
          JAFTA_KEY_PASSWORD: ${{ secrets.JAFTA_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tail -50

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          apksigner verify --print-certs --verbose "$APK" 2>&1 | tee SIGNATURE.txt
          echo "---KEY ID---"
          apksigner verify --print-certs "$APK" 2>&1 | grep "SHA-256 Digest" | head -1

      - name: Generate release manifest
        run: |
          VERSION=${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}
          APK_SHA=$(sha256sum android/app/build/outputs/apk/release/app-release.apk | awk '{print $1}')
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "apk_url": "https://github.com/nastechresearch/Jafta/releases/download/${VERSION}/app-release.apk",
            "apk_sha256": "${APK_SHA}",
            "signed_by": "NasTech Research (alias: jafta)",
            "keystore_sha256": "$(openssl dgst -sha256 -r keystore/jafta-release.keystore | awk '{print $1}')",
            "min_android_version": 26,
            "target_android_version": 35
          }
          EOF
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jafta ${{ github.ref_name }}
          body: |
            ## Jafta ${{ github.ref_name }}

            A local-first personal AI agent for Android. Derived from Jenny (AGPL-3.0), originally a fork of nanobot (MIT).

            **Build provenance:**
            - Signed by: NasTech Research (alias: `jafta`)
            - Keystore SHA-256: see `latest.json`
            - APK SHA-256: see `latest.json`

            **Install:**
            ```
            adb install app-release.apk
            ```

            Or download from the link below.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            latest.json
            SIGNATURE.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
